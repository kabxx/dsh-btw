name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install the tested DSH runtime
        run: |
          npm install --global "@deepseek-ai/dsh@$(node -p 'require("./package.json").engines.dsh')"
          printf 'DSH_INSTALL_DIR=%s/@deepseek-ai/dsh\n' "$(npm root -g)" >> "$GITHUB_ENV"
      - run: npm test
      - name: Build and pack the plugin
        run: npm run pack:local
